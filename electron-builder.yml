appId: cn.fudaner.app
productName: Fudaner
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Fudaner
mac:
  target: dmg
  icon: resources/icon.png
  # 没有苹果开发者证书：用本地（ad-hoc）签名，Apple 芯片的 Mac 才能运行
  identity: "-"
  hardenedRuntime: false
linux:
  target: dir
  icon: resources/icon.png
  category: Utility
